repos:
  - repo: local
    hooks:
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        entry: golangci-lint fmt
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint-run
        name: golangci-lint run --fix
        entry: golangci-lint run --fix
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test ./...
        entry: go test ./...
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
